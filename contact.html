<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LU Connect - Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="main-content">
        <div class="container">
            <div class="hero">
                <h1>Contact Us</h1>
                <p>Have a question or want to partner with LU Connect? Reach out to our team.</p>
            </div>

            <div class="card">
                <h3>Send a Message</h3>
                <form id="contactForm" style="display: flex; flex-direction: column; gap: 15px;">
                    <input type="text" id="name" placeholder="Your Name" required style="padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff;">
                    <input type="email" id="email" placeholder="Your Email" required style="padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff;">
                    <textarea id="message" placeholder="Your Message" rows="5" required style="padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff;"></textarea>
                    <button type="submit" class="btn btn-gold" id="submitBtn">Send Message</button>
                    <p id="formStatus" style="color: #FFD700; text-align: center;"></p>
                </form>
            </div>
        </div>
    </div>
    <script src="nav.js"></script>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://uuuqlzsczxekyfliviiv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_PVDBNFNYrV7-KfWwNGYnug_PTA0_b1E';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('formStatus');
            
            btn.innerText = 'Sending...';
            btn.disabled = true;

            const { error } = await supabase
                .from('messages')
                .insert([
                    { 
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        message: document.getElementById('message').value
                    }
                ]);

            if (error) {
                console.error(error);
                status.innerText = "Error sending message: " + error.message;
                status.style.color = "red";
            } else {
                status.innerText = "Message sent successfully! We will get back to you soon.";
                status.style.color = "#22c55e";
                document.getElementById('contactForm').reset();
            }
            
            btn.innerText = 'Send Message';
            btn.disabled = false;
        });
    </script>
</body>
</html>
